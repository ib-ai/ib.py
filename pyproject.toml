[project]
name = "ib-py"
version = "0.1.0"
description = "Discord bot for International Baccalaureate Discord server."
requires-python = ">=3.11"
dependencies = [
    "aerich>=0.9.2",
    "async-lru>=2.0.5",
    "discord-py>=2.6.4",
    "python-dotenv>=1.2.1",
    "toml>=0.10.2",
    "tortoise-orm[asyncpg]>=0.25.1",
]
readme = "README.md"

[[project.authors]]
name = "ib-ai"
email = ""

[project.license]
text = "GPL-3.0-only"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
]

[tool.aerich]
tortoise_orm = "src.ib_py.db.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
line-length = 95

[tool.isort]
profile = "black"

[tool.black]
line-length = 95

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13",
]
addopts = "--ignore=tests/test_tags.py"  # Ignore test_tags.py for now
