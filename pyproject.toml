[project]
name = "ib-py"
version = "0.1.0"
description = "Discord bot for International Baccalaureate Discord server."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aerich>=0.9.2",
    "async-lru>=2.0.5",
    "discord-py>=2.6.4",
    "python-dotenv>=1.2.1",
    "toml>=0.10.2",
    "tortoise-orm[asyncpg]>=0.25.1",
]
readme = "README.md"

[[project.authors]]
name = "ib-ai"
email = ""

[project.license]
text = "GPL-3.0-only"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]


[tool.aerich]
tortoise_orm = "src.ib_py.db.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
line-length = 95
